<!doctype html>
<html>
<head><title>Frames</title></head>
<body>
  <h1>Frames</h1>
  <div style="height: 100px"></div>

  <!-- another site (localhost, where the page is on 127.0.0.1), which Chrome runs in a process of its own -->
  <iframe id="cross" style="width: 300px; height: 200px; margin-left: 120px; border: 4px solid; padding: 6px"></iframe>
  <!-- the page's own site, run in the page's process -->
  <iframe id="same" src="framed.html" style="width: 300px; height: 200px"></iframe>

  <div style="height: 600px"></div>

  <!-- another site, holding a frame of its own site and one of the page's -->
  <iframe id="nested" style="width: 700px; height: 500px; margin-left: 40px"></iframe>

  <div id="host"></div>

  <script>
    const other = `http://localhost:${location.port}`
    document.querySelector('#cross').src = `${other}/framed.html`
    document.querySelector('#nested').src = `${other}/nested.html`
    document.querySelector('#host').attachShadow({mode: 'open'}).innerHTML = '<iframe class="shadowed" src="framed.html"></iframe>'

    // a frame more, a while after the page has loaded
    setTimeout(() => {
      const late = document.createElement('iframe')
      late.id = 'late'
      late.src = `${other}/framed.html`
      document.body.append(late)
    }, 1500)
  </script>
</body>
</html>
